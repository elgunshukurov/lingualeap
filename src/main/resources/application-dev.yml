spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/lingualeap
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    debugging:
      enabled: true

logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.authentication: TRACE
    ai.lingualeap.lingualeap: DEBUG
